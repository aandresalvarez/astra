# LOCAL REVIEW ARTIFACT ONLY. Creating this file does not authorize publishing
# a workflow, creating a remote ref/commit, or dispatching it.
#
# Host this artifact ONLY as a replacement of .github/workflows/ci.yml on the
# disposable alvaro/pr579-remote-publisher-20261105-main586 branch. That workflow path
# already exists on the default branch and can therefore be dispatched using
# the disposable ref's version. Do not create a new workflow path. This file
# must never enter the PR candidate tree; checkout below uses its immutable SHA.
# GITHUB_TOKEN contents:write is repository-scoped, not ref-scoped. The fixed
# commands below and repository branch protection constrain its intended use;
# they do not narrow the token's underlying capability.
name: Publish PR 579 through unchanged hooks

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-pr579-reviewed-candidate-publication
  cancel-in-progress: false

jobs:
  publish-reviewed-candidate:
    if: >-
      github.repository == 'aandresalvarez/astra' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/alvaro/pr579-remote-publisher-20261105-main586' &&
      github.workflow_ref == 'aandresalvarez/astra/.github/workflows/ci.yml@refs/heads/alvaro/pr579-remote-publisher-20261105-main586'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Suppress generated Python bytecode only; test selection and assertions
      # are unchanged. Evidence and the Swift wrapper live outside checkout.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the immutable reviewed candidate
        uses: actions/checkout@v5
        with:
          repository: aandresalvarez/astra
          ref: 47cc97c5b7b37e0d4e526354e89d0cdf97ee1d57
          fetch-depth: 0
          # The action's ephemeral GITHUB_TOKEN is used only by normal Git.
          # No PAT, SSH key, signing secret, or other user secret is supplied.
          persist-credentials: true

      - name: Verify candidate and prepare runner-only hook guards
        run: |
          set -euo pipefail
          publication_dir="$RUNNER_TEMP/astra-pr579-publication"
          mkdir -p "$publication_dir/bin" "$publication_dir/hooks"
          exec > >(tee -a "$publication_dir/preflight.log") 2>&1

          test "$GITHUB_REPOSITORY" = "aandresalvarez/astra"
          test "$(git rev-parse HEAD)" = "47cc97c5b7b37e0d4e526354e89d0cdf97ee1d57"
          test "$(git rev-parse 'HEAD^{tree}')" = "a7c710f40ed70261607b059aa129aad3f6559f6d"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git remote set-url origin https://github.com/aandresalvarez/astra.git
          test "$(git remote get-url --all --push origin)" = "https://github.com/aandresalvarez/astra.git"
          test "$(git ls-remote --heads origin refs/heads/alvaro/ssh-cancellation-workspace-release)" = $'d337f5dda08c0b2e427f42e10d5fbe2b34f815ac\trefs/heads/alvaro/ssh-cancellation-workspace-release'
          test "$(git ls-remote --heads origin refs/heads/main)" = $'b008d80ba6414c25f6aea5f2979ca236a0e9b85b\trefs/heads/main'
          git fetch --no-tags origin refs/heads/alvaro/ssh-cancellation-workspace-release:refs/remotes/origin/alvaro/ssh-cancellation-workspace-release
          test "$(git rev-parse refs/remotes/origin/alvaro/ssh-cancellation-workspace-release)" = "d337f5dda08c0b2e427f42e10d5fbe2b34f815ac"
          git merge-base --is-ancestor d337f5dda08c0b2e427f42e10d5fbe2b34f815ac HEAD
          git merge-base --is-ancestor b008d80ba6414c25f6aea5f2979ca236a0e9b85b HEAD

          git switch --create alvaro/pr579-remote-publication-run 47cc97c5b7b37e0d4e526354e89d0cdf97ee1d57
          git branch --set-upstream-to=origin/alvaro/ssh-cancellation-workspace-release alvaro/pr579-remote-publication-run
          test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" = "origin/alvaro/ssh-cancellation-workspace-release"
          # This upstream makes the actual hook see all candidate changes
          # relative to the original PR head, including the current-main merge.
          git diff --name-only d337f5dda08c0b2e427f42e10d5fbe2b34f815ac...HEAD > "$publication_dir/changed-paths.txt"
          test -s "$publication_dir/changed-paths.txt"

          test "$(git hash-object .githooks/pre-push)" = "af1eae4c1f032048136e4ae63ad59ce9311cb1d3"
          test "$(git hash-object script/prepush.sh)" = "da560df7bac094105157cde010f67e0d13558955"
          test "$(git hash-object script/swift_test.sh)" = "1c654d64ba6b2ee90649384afe09d92507560df8"
          test -x .githooks/pre-push
          git config --local push.followTags false

          # The same transparent wrapper used for local validation: add jobs 2
          # only when no job count was supplied; forward all other arguments.
          cat > "$publication_dir/bin/swift" <<'SWIFT_WRAPPER'
          #!/bin/bash
          set -euo pipefail
          case "${1:-}" in
            build|test|run)
              swift_command="$1"
              shift
              for argument in "$@"; do
                case "$argument" in
                  -j|--jobs|--jobs=*|-j[0-9]*) exec /usr/bin/swift "$swift_command" "$@" ;;
                esac
              done
              exec /usr/bin/swift "$swift_command" --jobs 2 "$@"
              ;;
            *) exec /usr/bin/swift "$@" ;;
          esac
          SWIFT_WRAPPER
          chmod 755 "$publication_dir/bin/swift"
          printf '%s\n' "$publication_dir/bin" >> "$GITHUB_PATH"

          # Runner-only hooksPath wraps the exact, unchanged repository hook.
          # The wrapper runs that real hook once with its original args/stdin,
          # then revalidates immediately before returning success to Git.
          cat > "$publication_dir/hooks/pre-push" <<'PRE_PUSH_WRAPPER'
          #!/bin/bash
          set -euo pipefail
          publication_dir="$RUNNER_TEMP/astra-pr579-publication"
          repository_root="$(git rev-parse --show-toplevel)"
          test "$repository_root" = "$GITHUB_WORKSPACE"
          cd "$repository_root"

          verify_checked_out_candidate() {
            test "$GITHUB_REPOSITORY" = "aandresalvarez/astra"
            test "$(git remote get-url --all --push origin)" = "https://github.com/aandresalvarez/astra.git"
            test "$(git rev-parse HEAD)" = "47cc97c5b7b37e0d4e526354e89d0cdf97ee1d57"
            test "$(git rev-parse 'HEAD^{tree}')" = "a7c710f40ed70261607b059aa129aad3f6559f6d"
            test "$(git symbolic-ref -q HEAD)" = "refs/heads/alvaro/pr579-remote-publication-run"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" = "origin/alvaro/ssh-cancellation-workspace-release"
            test "$(git rev-parse '@{upstream}')" = "d337f5dda08c0b2e427f42e10d5fbe2b34f815ac"
            test "$(git config --local --get core.hooksPath)" = "$publication_dir/hooks"
            test "$(git config --local --get push.followTags)" = "false"
            test "$(git hash-object .githooks/pre-push)" = "af1eae4c1f032048136e4ae63ad59ce9311cb1d3"
            test "$(git hash-object script/prepush.sh)" = "da560df7bac094105157cde010f67e0d13558955"
            test "$(git hash-object script/swift_test.sh)" = "1c654d64ba6b2ee90649384afe09d92507560df8"
            test -x .githooks/pre-push
            test "$(shasum -a 256 "$publication_dir/hooks/pre-push" | awk '{print $1}')" = "$ASTRA_PR579_PRE_PUSH_WRAPPER_SHA256"
            test "$(shasum -a 256 "$publication_dir/bin/swift" | awk '{print $1}')" = "$ASTRA_PR579_SWIFT_WRAPPER_SHA256"
            test "$(command -v swift)" = "$publication_dir/bin/swift"
            git merge-base --is-ancestor d337f5dda08c0b2e427f42e10d5fbe2b34f815ac HEAD
            git merge-base --is-ancestor b008d80ba6414c25f6aea5f2979ca236a0e9b85b HEAD
          }

          verify_live_remote_refs() {
            test "$(git ls-remote --heads --sort=refname origin refs/heads/alvaro/ssh-cancellation-workspace-release refs/heads/main)" = $'d337f5dda08c0b2e427f42e10d5fbe2b34f815ac\trefs/heads/alvaro/ssh-cancellation-workspace-release\nb008d80ba6414c25f6aea5f2979ca236a0e9b85b\trefs/heads/main'
          }

          test "$#" -eq 2
          test "$1" = "origin"
          test "$2" = "https://github.com/aandresalvarez/astra.git"
          stdin_receipt="$(mktemp "$publication_dir/pre-push-stdin.XXXXXX")"
          cat > "$stdin_receipt"
          test "$(wc -l < "$stdin_receipt" | tr -d '[:space:]')" = "1"
          IFS=$' \t' read -r local_ref local_sha remote_ref remote_sha extra < "$stdin_receipt"
          case "$local_ref" in
            HEAD|refs/heads/alvaro/pr579-remote-publication-run) ;;
            *) printf 'Unexpected source ref in Git pre-push stdin.\n' >&2; exit 1 ;;
          esac
          test "$local_sha" = "47cc97c5b7b37e0d4e526354e89d0cdf97ee1d57"
          test "$remote_ref" = "refs/heads/alvaro/ssh-cancellation-workspace-release"
          test "$remote_sha" = "d337f5dda08c0b2e427f42e10d5fbe2b34f815ac"
          test -z "$extra"
          verify_checked_out_candidate
          verify_live_remote_refs

          printf 'Invoking the unchanged repository pre-push hook once.\n'
          if "$repository_root/.githooks/pre-push" "$@" < "$stdin_receipt"; then
            printf 'Repository hook passed; revalidating immediately before publication.\n'
          else
            hook_status=$?
            printf 'Repository hook failed with status %s; publication blocked.\n' "$hook_status" >&2
            exit "$hook_status"
          fi

          verify_checked_out_candidate
          # This is the last guard before success returns to Git. It closes
          # the long hook interval; Git's normal expected-old-ref check also
          # applies. A tiny race remains: GitHub does not offer an atomic
          # transaction spanning this feature update and the read of main.
          verify_live_remote_refs
          exit 0
          PRE_PUSH_WRAPPER
          chmod 755 "$publication_dir/hooks/pre-push"
          test "$(shasum -a 256 "$publication_dir/hooks/pre-push" | awk '{print $1}')" = "f09a977ad1aba0a3d3f4a4e769a3292ed88f5b6d54cbfc972c71070ffce79f84"
          test "$(shasum -a 256 "$publication_dir/bin/swift" | awk '{print $1}')" = "90af964951af0a0f60e3ec72e9f46b8e1b816c138efbc35d6afe0603a65c691c"
          printf '%s\n' 'ASTRA_PR579_PRE_PUSH_WRAPPER_SHA256=f09a977ad1aba0a3d3f4a4e769a3292ed88f5b6d54cbfc972c71070ffce79f84' >> "$GITHUB_ENV"
          printf '%s\n' 'ASTRA_PR579_SWIFT_WRAPPER_SHA256=90af964951af0a0f60e3ec72e9f46b8e1b816c138efbc35d6afe0603a65c691c' >> "$GITHUB_ENV"
          shasum -a 256 "$publication_dir/hooks/pre-push" "$publication_dir/bin/swift" > "$publication_dir/wrapper-hashes.txt"
          git config --local core.hooksPath "$publication_dir/hooks"
          test "$(git config --local --get core.hooksPath)" = "$publication_dir/hooks"
          git rev-parse HEAD 'HEAD^{tree}' > "$publication_dir/candidate.txt"

      - name: Cache SwiftPM using the repository CI policy
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Perform the ordinary feature push through guarded unchanged hook
        run: |
          set -euo pipefail
          publication_dir="$RUNNER_TEMP/astra-pr579-publication"
          exec > >(tee -a "$publication_dir/ordinary-push.log") 2>&1

          # No tests run separately. Git invokes the runner-only guard, which
          # runs the real repository hook exactly once and guards again after
          # it passes. The candidate's hooks/tests/check definitions are intact.
          test "$GITHUB_REPOSITORY" = "aandresalvarez/astra"
          test "$(git remote get-url --all --push origin)" = "https://github.com/aandresalvarez/astra.git"
          test "$(git rev-parse HEAD)" = "47cc97c5b7b37e0d4e526354e89d0cdf97ee1d57"
          test "$(git rev-parse 'HEAD^{tree}')" = "a7c710f40ed70261607b059aa129aad3f6559f6d"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" = "origin/alvaro/ssh-cancellation-workspace-release"
          test "$(git rev-parse '@{upstream}')" = "d337f5dda08c0b2e427f42e10d5fbe2b34f815ac"
          test "$(git config --local --get core.hooksPath)" = "$publication_dir/hooks"
          test "$(git config --local --get push.followTags)" = "false"
          test "$(git hash-object .githooks/pre-push)" = "af1eae4c1f032048136e4ae63ad59ce9311cb1d3"
          test "$(git hash-object script/prepush.sh)" = "da560df7bac094105157cde010f67e0d13558955"
          test "$(git hash-object script/swift_test.sh)" = "1c654d64ba6b2ee90649384afe09d92507560df8"
          test -x .githooks/pre-push
          test "$(shasum -a 256 "$publication_dir/hooks/pre-push" | awk '{print $1}')" = "f09a977ad1aba0a3d3f4a4e769a3292ed88f5b6d54cbfc972c71070ffce79f84"
          test "$ASTRA_PR579_PRE_PUSH_WRAPPER_SHA256" = "f09a977ad1aba0a3d3f4a4e769a3292ed88f5b6d54cbfc972c71070ffce79f84"
          test "$(shasum -a 256 "$publication_dir/bin/swift" | awk '{print $1}')" = "90af964951af0a0f60e3ec72e9f46b8e1b816c138efbc35d6afe0603a65c691c"
          test "$ASTRA_PR579_SWIFT_WRAPPER_SHA256" = "90af964951af0a0f60e3ec72e9f46b8e1b816c138efbc35d6afe0603a65c691c"
          test "$(command -v swift)" = "$publication_dir/bin/swift"
          git merge-base --is-ancestor d337f5dda08c0b2e427f42e10d5fbe2b34f815ac HEAD
          git merge-base --is-ancestor b008d80ba6414c25f6aea5f2979ca236a0e9b85b HEAD
          test "$(git ls-remote --heads origin refs/heads/main)" = $'b008d80ba6414c25f6aea5f2979ca236a0e9b85b\trefs/heads/main'
          test "$(git ls-remote --heads origin refs/heads/alvaro/ssh-cancellation-workspace-release)" = $'d337f5dda08c0b2e427f42e10d5fbe2b34f815ac\trefs/heads/alvaro/ssh-cancellation-workspace-release'

          # The only original-ref write. No force, no bypass, no main update,
          # no tag push, and no direct API ref update. Git blocks this write if
          # the real pre-push hook or either guard fails, and enforces normal
          # remote ref compare/update and fast-forward checks afterward.
          git push --porcelain origin HEAD:refs/heads/alvaro/ssh-cancellation-workspace-release

          test "$(git ls-remote --heads origin refs/heads/alvaro/ssh-cancellation-workspace-release)" = $'47cc97c5b7b37e0d4e526354e89d0cdf97ee1d57\trefs/heads/alvaro/ssh-cancellation-workspace-release'
          test "$(git rev-parse HEAD)" = "47cc97c5b7b37e0d4e526354e89d0cdf97ee1d57"
          test "$(git rev-parse 'HEAD^{tree}')" = "a7c710f40ed70261607b059aa129aad3f6559f6d"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' 'Verified PR 579 head: 47cc97c5b7b37e0d4e526354e89d0cdf97ee1d57' > "$publication_dir/published-head.txt"
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          PR #579 was updated to `47cc97c5b7b37e0d4e526354e89d0cdf97ee1d57` through an ordinary Git push after the unchanged repository pre-push hook and runner-only post-hook guards passed. The candidate tree is `a7c710f40ed70261607b059aa129aad3f6559f6d`. Only the runner's local `core.hooksPath` points to the guard wrapper; the PR's hook/test/check files are unchanged.

          The push used the ephemeral `GITHUB_TOKEN`. It may not trigger the normal PR CI workflow automatically. After independently verifying the exact PR head, the operator must check for the normal CI run and manually dispatch `ci.yml` on `alvaro/ssh-cancellation-workspace-release` if needed. This publication workflow does not dispatch CI, merge, approve, or resolve reviews.
          SUMMARY

      - name: Preserve publication evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-pr579-publication-evidence
          path: ${{ runner.temp }}/astra-pr579-publication/
          if-no-files-found: warn
          retention-days: 14

# No cleanup deletes repository data or other runs' files. The hosted runner
# owns the temporary directory and removes its environment after completion.
# Checkout performs its standard credential cleanup. GitHub retains the job
# log, and the evidence upload preserves the preflight and full hook/push logs.
#
# Separate operator cleanup plan (not performed by this workflow): after the
# run has finished, retain/download its logs and ref/SHA stdin receipt, verify
# the original feature ref is the exact candidate, and verify normal CI on that
# head. Then check the disposable publisher ref still equals the exact helper
# commit created for this run before deleting only that owned remote ref. Never
# merge its ci.yml replacement into the PR or main. Keep the signed candidate
# temporary ref until the candidate is verified reachable from the original
# feature branch. No worktree or unrelated ref/artifact deletion is included.
